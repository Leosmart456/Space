<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <!-- Opaque (not translucent) status bar: forces a literal solid black bar on
         iOS standalone/home-screen instead of letting page content show through it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="SpaceX" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-config" content="none" />
    <title>SpaceX | Pre-IPO Investment Platform</title>
    <style>
      /* Paint pure black immediately, before CSS/JS load, so there is no white
         flash and no colored pixels near the top edge that a browser could
         sample when deciding the toolbar/status-bar color. */
      html, body { background: #000000; }
    </style>
    <meta name="description" content="Own equity in the most ambitious company in history — before the public IPO. Exclusive access for accredited investors." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="SpaceX | Pre-IPO Investment Platform" />
    <meta property="og:description" content="Own equity in the most ambitious company in history — before the public IPO." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpaceX | Pre-IPO Investment Platform" />
    <meta name="twitter:description" content="Own equity in the most ambitious company in history — before the public IPO." />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
