openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SpaceX Pre-IPO Share Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: investor
    description: Accredited investor verification
  - name: purchases
    description: Share purchase requests
  - name: dashboard
    description: User dashboard data
  - name: admin
    description: Admin operations
  - name: settings
    description: Platform settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # --- Auth ---
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  # --- Investor Verification ---
  /investor/verify:
    post:
      operationId: verifyInvestor
      tags: [investor]
      summary: Submit accredited investor verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorVerification"
      responses:
        "200":
          description: Verification saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  # --- Purchase Requests ---
  /purchases:
    get:
      operationId: listPurchases
      tags: [purchases]
      summary: List user's purchase requests
      responses:
        "200":
          description: List of purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseRequest"
        "401":
          description: Unauthorized
    post:
      operationId: createPurchase
      tags: [purchases]
      summary: Submit a share purchase request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "201":
          description: Purchase request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseRequest"
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  # --- Dashboard ---
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get user's dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

  /dashboard/transfers:
    get:
      operationId: listTransfers
      tags: [dashboard]
      summary: List user's transfer requests
      responses:
        "200":
          description: Transfer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransferRequest"
        "401":
          description: Unauthorized
    post:
      operationId: createTransfer
      tags: [dashboard]
      summary: Submit a brokerage transfer request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferRequest"
        "401":
          description: Unauthorized

  # --- Settings ---
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get platform settings (share price, system mode)
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"

  # --- Admin ---
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide statistics
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserDetail"
        "401":
          description: Unauthorized

  /admin/users/{id}/credit:
    post:
      operationId: creditUserShares
      tags: [admin]
      summary: Credit shares to a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareCredit"
      responses:
        "200":
          description: Shares credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
        "404":
          description: User not found

  /admin/purchases:
    get:
      operationId: listAdminPurchases
      tags: [admin]
      summary: List all purchase requests
      responses:
        "200":
          description: All purchase requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPurchaseDetail"
        "401":
          description: Unauthorized

  /admin/purchases/{id}/status:
    patch:
      operationId: updatePurchaseStatus
      tags: [admin]
      summary: Update purchase request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPurchaseDetail"
        "404":
          description: Not found

  /admin/settings:
    patch:
      operationId: updateSettings
      tags: [admin]
      summary: Update platform settings (share price, system mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
        "401":
          description: Unauthorized

  /admin/broadcast:
    post:
      operationId: sendBroadcast
      tags: [admin]
      summary: Send broadcast email to all users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastEmail"
      responses:
        "200":
          description: Broadcast sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResult"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        accreditedStatus:
          type: string
          enum: [pending, yes, no]
        totalSharesCredited:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - fullName
        - email
        - accreditedStatus
        - totalSharesCredited
        - createdAt

    ProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string

    InvestorVerification:
      type: object
      properties:
        isAccredited:
          type: boolean
      required:
        - isAccredited

    PurchaseRequest:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        amountUsd:
          type: number
        requestedShares:
          type: number
        pricePerShare:
          type: number
        status:
          type: string
          enum: [pending_review, confirmed, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amountUsd
        - requestedShares
        - pricePerShare
        - status
        - createdAt

    PurchaseInput:
      type: object
      properties:
        amountUsd:
          type: number
          minimum: 5000
        agreedToTerms:
          type: boolean
      required:
        - amountUsd
        - agreedToTerms

    DashboardSummary:
      type: object
      properties:
        totalShares:
          type: number
        sharePrice:
          type: number
        totalUsdValue:
          type: number
        systemMode:
          type: string
          enum: [pre_ipo, post_ipo]
        pendingPurchases:
          type: integer
        confirmedPurchases:
          type: integer
      required:
        - totalShares
        - sharePrice
        - totalUsdValue
        - systemMode
        - pendingPurchases
        - confirmedPurchases

    TransferRequest:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        brokerageName:
          type: string
        brokerageAccountNumber:
          type: string
        accountHolderName:
          type: string
        status:
          type: string
          enum: [transfer_requested, completed]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - brokerageName
        - brokerageAccountNumber
        - accountHolderName
        - status
        - createdAt

    TransferInput:
      type: object
      properties:
        brokerageName:
          type: string
        brokerageAccountNumber:
          type: string
        accountHolderName:
          type: string
      required:
        - brokerageName
        - brokerageAccountNumber
        - accountHolderName

    PlatformSettings:
      type: object
      properties:
        sharePrice:
          type: number
        systemMode:
          type: string
          enum: [pre_ipo, post_ipo]
      required:
        - sharePrice
        - systemMode

    AdminCredentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AdminSession:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalSharesCredited:
          type: number
        totalUsdValue:
          type: number
        pendingPurchases:
          type: integer
        confirmedPurchases:
          type: integer
        accreditedUsers:
          type: integer
      required:
        - totalUsers
        - totalSharesCredited
        - totalUsdValue
        - pendingPurchases
        - confirmedPurchases
        - accreditedUsers

    AdminUserDetail:
      type: object
      properties:
        id:
          type: integer
        clerkId:
          type: string
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        accreditedStatus:
          type: string
          enum: [pending, yes, no]
        totalSharesCredited:
          type: number
        totalUsdValue:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - clerkId
        - fullName
        - email
        - accreditedStatus
        - totalSharesCredited
        - totalUsdValue
        - createdAt

    ShareCredit:
      type: object
      properties:
        shares:
          type: number
          minimum: 0.001
        note:
          type: ["string", "null"]
      required:
        - shares

    AdminPurchaseDetail:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        userFullName:
          type: string
        userEmail:
          type: string
        amountUsd:
          type: number
        requestedShares:
          type: number
        pricePerShare:
          type: number
        status:
          type: string
          enum: [pending_review, confirmed, rejected]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - userFullName
        - userEmail
        - amountUsd
        - requestedShares
        - pricePerShare
        - status
        - createdAt

    PurchaseStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending_review, confirmed, rejected]
      required:
        - status

    SettingsUpdate:
      type: object
      properties:
        sharePrice:
          type: number
          minimum: 0.01
        systemMode:
          type: string
          enum: [pre_ipo, post_ipo]

    BroadcastEmail:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
      required:
        - subject
        - body

    BroadcastResult:
      type: object
      properties:
        sent:
          type: integer
        message:
          type: string
      required:
        - sent
        - message
